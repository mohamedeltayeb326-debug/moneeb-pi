<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONEEB GLOBAL | منصة منيب للتجارة والاستثمار</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { color: #f59e0b; margin-bottom: 8px; font-size: 1.6rem; }
    p { color: #cbd5e1; line-height: 1.6; margin-bottom: 24px; }
    .status {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #38bdf8;
    }
    button {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #d97706; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MONEEB GLOBAL</h1>
    <p>منصة منيب للتجارة والاستثمار والحلول الرقمية</p>
    <div class="status" id="user-status">جاري الاتصال بشبكة Pi...</div>
    <button onclick="testPayment()">تجربة الدفع (1 Test-Pi)</button>
  </div>

  <script>
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: true });

    async function callBackend(action, paymentId, txid = null) {
      const response = await fetch('/api/payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, paymentId, txid })
      });
      return response.json();
    }

    function onIncompletePaymentFound(payment) {
      if (payment.transaction && payment.transaction.txid) {
        callBackend('complete', payment.identifier, payment.transaction.txid);
      }
    }

    async function auth() {
      try {
        const scopes = ['username', 'payments'];
        const authResult = await Pi.authenticate(scopes, onIncompletePaymentFound);
        document.getElementById('user-status').innerText = "مرحباً بك: @" + authResult.user.username;
      } catch (err) {
        document.getElementById('user-status').innerText = "يرجى فتح المنصة داخل متصفح Pi Browser";
      }
    }

    function testPayment() {
      Pi.createPayment({
        amount: 1,
        memo: "اختبار منصة MONEEB GLOBAL",
        metadata: { orderId: "test_001" }
      }, {
        onReadyForServerApproval: async function(paymentId) {
          await callBackend('approve', paymentId);
        },
        onReadyForServerCompletion: async function(paymentId, txid) {
          await callBackend('complete', paymentId, txid);
          alert("تمت عملية الدفع بنجاح واكتملت على الشبكة!");
        },
        onCancel: function(paymentId) {
          alert("تم إلغاء العملية");
        },
        onError: function(error, payment) {
          alert("خطأ: " + error.message);
        }
      });
    }

    auth();
  </script>
</body>
</html>
